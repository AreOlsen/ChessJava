name: Maven Workflow

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Build JAR
        run: mvn -B package --file pom.xml

      - name: Create Windows EXE
        shell: pwsh
        run: |
          $version = mvn help:evaluate "-Dexpression=project.version" "-q" "-DforceStdout"

          jpackage `
            --name Chess `
            --app-version $version `
            --vendor "Are Olsen" `
            --input target `
            --main-jar "chess-$version.jar" `
            --main-class areolsen.App `
            --type exe `
            --dest target/installer

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Windows
          path: target/installer/*.exe

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Run tests
        run: mvn -B clean test --file pom.xml

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: JUnit Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
